<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatorebmi</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main>
        <h1>Calcolatore BMI</h1>
        
        <div class="card">
            <form action="bmi.php" method="post">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Luca" required> <!--indichiamo che questo campo è obblicatorio-->              
                </div>

                <div class="form-group">
                    <label form="peso">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" placeholder="70" required>
                </div>

                <div class="form-group">
                    <label form="altezza">Altezza (cm)</label>
                    <input type="number" id="altezza" name="altezza" placeholder="178" required>
                </div>

                <button type="submit">Calcola</button>
            </form>
        </div>

        

    </main>
</body>
</html>
